<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVOR X v4.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background-color: #050505; 
            touch-action: none; font-family: 'Orbitron', sans-serif; user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }
        
        .damage-flash { animation: flash 0.2s ease-out; }
        @keyframes flash { 0% { box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.8); } 100% { box-shadow: none; } }
        
        .low-hp-pulse { animation: pulseBorder 1s infinite alternate; }
        @keyframes pulseBorder { 0% { box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.5); } 100% { box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.9); } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            position: absolute; inset: 0; z-index: 50;
        }
    </style>
</head>
<body class="text-white">

    <div class="crt-overlay"></div>

    <!-- Main Menu & Shop -->
    <div id="main-menu" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-40 transition-opacity duration-300">
        <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500 mb-2 tracking-wider uppercase text-center" style="filter: drop-shadow(0 0 10px rgba(255,0,0,0.5));">SURVIVOR X</h1>
        <p class="text-gray-400 mb-8 tracking-widest text-sm">v4.3 EDITION (WEAPON RANGE ADJUSTED)</p>
        
        <div class="flex gap-4 mb-8">
            <div class="bg-gray-900 border border-gray-700 p-4 rounded-xl w-64 shadow-lg">
                <h2 class="text-xl font-bold text-yellow-400 mb-2 border-b border-gray-700 pb-2">STATS</h2>
                <p>Total Gold: <span id="menu-gold" class="text-yellow-300 font-bold">0</span> G</p>
                <div class="mt-4 space-y-2 text-sm">
                    <button onclick="buyUpgrade('attack')" class="w-full bg-gray-800 hover:bg-gray-700 p-2 rounded flex justify-between">
                        <span>ATK Up (<span id="upg-attack-lv">0</span>)</span> <span id="upg-attack-cost" class="text-yellow-400">100G</span>
                    </button>
                    <button onclick="buyUpgrade('maxHp')" class="w-full bg-gray-800 hover:bg-gray-700 p-2 rounded flex justify-between">
                        <span>HP Up (<span id="upg-maxHp-lv">0</span>)</span> <span id="upg-maxHp-cost" class="text-yellow-400">100G</span>
                    </button>
                    <button onclick="buyUpgrade('moveSpeed')" class="w-full bg-gray-800 hover:bg-gray-700 p-2 rounded flex justify-between">
                        <span>SPD Up (<span id="upg-moveSpeed-lv">0</span>)</span> <span id="upg-moveSpeed-cost" class="text-yellow-400">100G</span>
                    </button>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-700 p-4 rounded-xl w-80 shadow-lg h-72 overflow-y-auto">
                <h2 class="text-xl font-bold text-blue-400 mb-2 border-b border-gray-700 pb-2">ARMORY</h2>
                <div id="weapon-list" class="space-y-2"></div>
            </div>
        </div>
        
        <button onclick="startGame()" class="px-12 py-4 bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 text-white font-black text-2xl rounded-full shadow-[0_0_20px_rgba(255,0,0,0.5)] transform transition hover:scale-105 active:scale-95">
            INITIATE DEPLOYMENT
        </button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud" class="absolute inset-0 pointer-events-none p-4 flex flex-col justify-between hidden z-20">
        <div class="flex justify-between items-start">
            <div class="bg-black/50 p-3 rounded-lg border border-gray-800 backdrop-blur-sm pointer-events-auto flex flex-col gap-1">
                <div class="flex justify-between items-center gap-4">
                    <div>
                        <p id="hud-wave" class="text-xl font-bold text-red-500">WAVE: 1</p>
                        <p id="hud-time" class="text-2xl font-mono">00:00</p>
                        <p id="hud-gold" class="text-yellow-400 font-bold flex items-center gap-1 mt-1">
                            <span id="gold-val">0</span> G
                        </p>
                    </div>
                    <button onclick="togglePause()" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded text-xs font-bold text-gray-300">PAUSE [ESC]</button>
                </div>
            </div>
            
            <div class="bg-black/50 p-3 rounded-lg border border-gray-800 backdrop-blur-sm text-right">
                <p id="hud-weapon" class="text-lg font-bold text-blue-400">Pistol Lv.1</p>
                <div class="text-2xl font-mono tracking-tighter mt-1">
                    <span id="hud-ammo-current" class="text-white">12</span>
                    <span class="text-gray-500 text-lg">/</span>
                    <span id="hud-ammo-max" class="text-gray-400 text-lg">12</span>
                </div>
                <p id="hud-reloading" class="text-red-500 font-bold text-sm animate-pulse hidden">RELOADING...</p>
            </div>
        </div>

        <div class="w-full max-w-2xl mx-auto mb-6">
            <div class="flex justify-between text-xs font-bold text-gray-400 mb-1 px-1">
                <span>LV <span id="hud-level">1</span></span>
                <span id="hud-exp-text">0 / 10</span>
            </div>
            <div class="w-full bg-gray-900 h-2 rounded-full border border-gray-700 overflow-hidden mb-2">
                <div id="hud-exp-bar" class="bg-blue-500 h-full w-0 transition-all duration-200"></div>
            </div>
            <div class="w-full bg-gray-900 h-6 rounded-full border border-gray-700 overflow-hidden relative shadow-[0_0_10px_rgba(255,0,0,0.2)]">
                <div id="hud-hp-bar" class="bg-gradient-to-r from-red-600 to-green-500 h-full w-full transition-all duration-200"></div>
                <div class="absolute inset-0 flex items-center justify-center text-xs font-black drop-shadow-md">
                    <span id="hud-hp-text">100 / 100</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-40 hidden backdrop-blur-sm">
        <h2 class="text-5xl font-black text-white mb-2 tracking-widest">PAUSED</h2>
        <p class="text-gray-400 mb-8">SYSTEM HALTED</p>
        <div class="flex flex-col gap-4 w-64">
            <button onclick="togglePause()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded shadow-lg border border-blue-400">
                RESUME
            </button>
            <button onclick="returnToMenu()" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded shadow-lg border border-gray-600">
                ABORT TO BASE
            </button>
        </div>
    </div>

    <!-- Level Up Screen -->
    <div id="levelup-screen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-30 hidden backdrop-blur-sm">
        <h2 class="text-4xl font-black text-blue-400 mb-8 animate-bounce">LEVEL UP</h2>
        <div id="upgrade-options" class="flex gap-4 w-full max-w-4xl px-4 justify-center"></div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-40 hidden backdrop-blur-md">
        <h2 class="text-6xl font-black text-red-600 mb-4 tracking-widest shadow-red-500/50 drop-shadow-lg">SYSTEM FAILURE</h2>
        <p class="text-xl text-gray-300 mb-2">Survived until Wave: <span id="go-wave" class="text-white font-bold"></span></p>
        <p class="text-xl text-gray-300 mb-8">Gold Collected: <span id="go-gold" class="text-yellow-400 font-bold"></span> G</p>
        <button onclick="returnToMenu()" class="px-8 py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded shadow-lg border border-gray-600">
            RETURN TO BASE
        </button>
    </div>

    <!-- Mobile Joystick -->
    <div id="joystick-zone" class="absolute bottom-12 left-12 w-32 h-32 bg-white/5 rounded-full border border-white/20 z-20 md:hidden touch-none">
        <div id="joystick-knob" class="w-12 h-12 bg-white/40 rounded-full absolute top-10 left-10 pointer-events-none shadow-lg backdrop-blur-sm transition-transform duration-75"></div>
    </div>

    <canvas id="gameCanvas" class="z-10"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        const DEFAULT_SAVE = {
            gold: 0,
            weapons: { pistol: true, shotgun: false, sniper: false, machinegun: false },
            upgrades: { attack: 0, maxHp: 0, moveSpeed: 0 },
            equipped: 'pistol'
        };
        let saveData = JSON.parse(localStorage.getItem('survivorXv43Save')) || DEFAULT_SAVE;
        function saveGame() { localStorage.setItem('survivorXv43Save', JSON.stringify(saveData)); }
        
        // 권총(pistol): 사거리(bullet speed & life) 대폭 증가 및 에볼루션 시 장거리 저격형 성능 부여
        // 샷건(shotgun): 레벨업에 따라 탄 퍼짐각(spread)과 탄환 개수(pellets), 사거리(life) 조절

                    { dmg: 100, cd: 0.2, mag: 28, maxMag: 28, reload: 1.0, pierce: 0, targets: 2, speed: 1250, life: 2.5, type: 'dual' },
                    { dmg: 110, cd: 0.2, mag: 30, maxMag: 30, reload: 1.0, pierce: 0, targets: 2, speed: 1300, life: 2.6, type: 'dual' },
                    { dmg: 130, cd: 0.15, mag: 35, maxMag: 35, reload: 0.9, pierce: 1, targets: 3, speed: 1500, life: 3.0, type: 'akimbo', name: 'Akimbo Blasters' },

                    { dmg: 25, cd: 0.8, mag: 6, maxMag: 6, reload: 2.0, pierce: 0, pellets: 5, spread: 0.5, speed: 650, life: 0.8, type: 'spread' },
                    { dmg: 30, cd: 0.75, mag: 6, maxMag: 6, reload: 1.9, pierce: 0, pellets: 6, spread: 0.55, speed: 680, life: 0.85, type: 'spread' },

                    { dmg: 40, cd: 0.7, mag: 8, maxMag: 8, reload: 1.7, pierce: 0, pellets: 7, spread: 0.65, speed: 720, life: 0.95, type: 'spread' },
                    { dmg: 50, cd: 0.6, mag: 10, maxMag: 10, reload: 1.5, pierce: 1, pellets: 8, spread: 0.7, speed: 750, life: 1.0, type: 'spread', name: 'Combat Shotgun' },

                    { dmg: 130, cd: 0.4, mag: 16, maxMag: 16, reload: 1.0, pierce: 3, pellets: 16, spread: 1.1, speed: 950, life: 1.5, type: 'hellfire', name: 'Hellfire Cannon' },
                ]
            },
            sniper: {
                id: 'sniper', name: 'Sniper', cost: 3200,
                levels: [
                    { dmg: 150, cd: 1.5, mag: 5, maxMag: 5, reload: 2.5, pierce: 3, radius: 4, speed: 1500, life: 2.0, type: 'pierce' },
                    { dmg: 200, cd: 1.4, mag: 5, maxMag: 5, reload: 2.4, pierce: 4, radius: 4, speed: 1500, life: 2.0, type: 'pierce' },
                    { dmg: 250, cd: 1.3, mag: 6, maxMag: 6, reload: 2.3, pierce: 4, radius: 4, speed: 1600, life: 2.1, type: 'pierce' },
                    { dmg: 300, cd: 1.2, mag: 6, maxMag: 6, reload: 2.2, pierce: 5, radius: 5, speed: 1600, life: 2.1, type: 'pierce' },
                    { dmg: 450, cd: 1.0, mag: 8, maxMag: 8, reload: 2.0, pierce: 8, radius: 8, speed: 1800, life: 2.5, type: 'railgun', name: 'Railgun' },
                    { dmg: 550, cd: 0.9, mag: 8, maxMag: 8, reload: 1.9, pierce: 8, radius: 8, speed: 1800, life: 2.5, type: 'railgun' },
                    { dmg: 650, cd: 0.9, mag: 10, maxMag: 10, reload: 1.8, pierce: 9, radius: 10, speed: 1900, life: 2.6, type: 'railgun' },
                    { dmg: 750, cd: 0.8, mag: 10, maxMag: 10, reload: 1.7, pierce: 9, radius: 10, speed: 1900, life: 2.6, type: 'railgun' },
                    { dmg: 850, cd: 0.8, mag: 12, maxMag: 12, reload: 1.6, pierce: 10, radius: 12, speed: 2000, life: 2.8, type: 'railgun' },
                    { dmg: 2000, cd: 1.5, mag: 5, maxMag: 5, reload: 2.0, pierce: 99, radius: 30, speed: 2200, life: 3.5, type: 'pulse', name: 'Pulse Rail Blaster' },
                ]
            },
            machinegun: {
                id: 'machinegun', name: 'Machine Gun', cost: 5000,
                levels: [
                    { dmg: 15, cd: 0.1, mag: 40, maxMag: 40, reload: 2.0, pierce: 0, speed: 900, life: 1.2, type: 'rapid' },
                    { dmg: 18, cd: 0.1, mag: 50, maxMag: 50, reload: 1.9, pierce: 0, speed: 900, life: 1.2, type: 'rapid' },
                    { dmg: 22, cd: 0.09, mag: 60, maxMag: 60, reload: 1.8, pierce: 0, speed: 950, life: 1.3, type: 'rapid' },
                    { dmg: 26, cd: 0.09, mag: 70, maxMag: 70, reload: 1.7, pierce: 0, speed: 950, life: 1.3, type: 'rapid' },
                    { dmg: 32, cd: 0.06, mag: 80, maxMag: 80, reload: 1.5, pierce: 0, speed: 1000, life: 1.4, type: 'minigun', name: 'Minigun' },
                    { dmg: 38, cd: 0.06, mag: 90, maxMag: 90, reload: 1.4, pierce: 0, speed: 1000, life: 1.4, type: 'minigun' },
                    { dmg: 45, cd: 0.05, mag: 100, maxMag: 100, reload: 1.3, pierce: 0, speed: 1050, life: 1.5, type: 'minigun' },
                    { dmg: 55, cd: 0.05, mag: 120, maxMag: 120, reload: 1.2, pierce: 0, speed: 1050, life: 1.5, type: 'minigun' },
                    { dmg: 65, cd: 0.04, mag: 130, maxMag: 130, reload: 1.1, pierce: 0, speed: 1100, life: 1.6, type: 'minigun' },
                    { dmg: 90, cd: 0.03, mag: 150, maxMag: 150, reload: 1.0, pierce: 2, speed: 1200, life: 1.8, type: 'plasma', name: 'Plasma Machine Gun' },
                ]
            }
        };

        const PASSIVES = {
            power: { id: 'power', name: 'Power Boost', desc: 'Weapon Damage +15%', max: 5 },
            speed: { id: 'speed', name: 'Swift Boots', desc: 'Move Speed +10%', max: 5 },
            reload: { id: 'reload', name: 'Quick Reload', desc: 'Reload & Cooldown -15%', max: 5 },
            magnet: { id: 'magnet', name: 'Item Magnet', desc: 'Pickup Radius +25%', max: 5 },
            crit: { id: 'crit', name: 'Critical Strike', desc: '20% Chance for 2x Damage', max: 5 },
            regen: { id: 'regen', name: 'Nano Regen', desc: 'Regenerate 1.5% Max HP/sec', max: 5 },
            shockwave: { id: 'shockwave', name: 'Shockwave Pulse', desc: 'Periodic Knockback Pulse', max: 5 },
        };

        let gameState = 'MENU';
        let lastTime = 0, gameTime = 0, wave = 1;
        let goldEarned = 0, enemySpawnTimer = 0;
        let camX = 0, camY = 0, camZoom = 1;

        let player, weaponState;
        let enemies = [], bullets = [], enemyBullets = [], gems = [], particles = [], floatTexts = [];
        let exp = 0, expNeeded = 10, level = 1;

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => {
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            if(e.key === 'Escape') {
                if(gameState === 'PLAYING' || gameState === 'PAUSED') togglePause();
            }
        });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let joyActive = false, joyVector = {x: 0, y: 0};
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyCenter = {x: 0, y: 0};

        joyZone.addEventListener('touchstart', e => {
            joyActive = true;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            handleJoyMove(e.touches[0]);
        });
        joyZone.addEventListener('touchmove', e => {
            if(joyActive) handleJoyMove(e.touches[0]);
            e.preventDefault();
        });
        joyZone.addEventListener('touchend', () => {
            joyActive = false; joyVector = {x: 0, y: 0};
            joyKnob.style.transform = `translate(0px, 0px)`;
        });

        function handleJoyMove(touch) {
            const dx = touch.clientX - joyCenter.x;
            const dy = touch.clientY - joyCenter.y;
            const dist = Math.hypot(dx, dy);
            const maxDist = 40;
            const normalizedDist = Math.min(dist, maxDist);
            const angle = Math.atan2(dy, dx);
            
            joyVector.x = Math.cos(angle) * (normalizedDist/maxDist);
            joyVector.y = Math.sin(angle) * (normalizedDist/maxDist);
            joyKnob.style.transform = `translate(${Math.cos(angle)*normalizedDist}px, ${Math.sin(angle)*normalizedDist}px)`;
        }

        function togglePause() {
            if(gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('pause-screen').classList.remove('hidden');
            } else if(gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('pause-screen').classList.add('hidden');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        function initGame() {
            const baseHp = 100 + (saveData.upgrades.maxHp * 20);
            const baseSpeed = 150 + (saveData.upgrades.moveSpeed * 10);
            
            player = {
                x: 0, y: 0, radius: 15,
                hp: baseHp, maxHp: baseHp, speed: baseSpeed,
                weaponLevel: 1,
                passives: { power: 0, speed: 0, reload: 0, magnet: 0, crit: 0, regen: 0, shockwave: 0 },
                shockwaveTimer: 0
            };

            const wData = WEAPON_DATA[saveData.equipped].levels[0];
            weaponState = {
                id: saveData.equipped,
                lastFired: 0,
                mag: wData.mag,
                isReloading: false,
                reloadTimer: 0
            };

            enemies = []; bullets = []; enemyBullets = []; gems = []; particles = []; floatTexts = [];
            gameTime = 0; wave = 1; goldEarned = 0; exp = 0; expNeeded = 10; level = 1;
            gameState = 'PLAYING';
            lastTime = performance.now();
            
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function getStatMultipliers() {
            const p = player.passives;
            return {
                dmg: 1 + (saveData.upgrades.attack * 0.1) + (p.power * 0.15),
                speed: 1 + (p.speed * 0.1),
                reloadCd: Math.max(0.2, 1 - (p.reload * 0.15)),
                magnet: 1 + (p.magnet * 0.25),
                critChance: p.crit * 0.2
            };
        }

        function spawnEnemy(dt) {
            enemySpawnTimer -= dt;
            if(enemySpawnTimer <= 0) {
                const spawnInterval = Math.max(0.1, 1.2 - (wave * 0.05));
                enemySpawnTimer = spawnInterval;
                
                const angle = Math.random() * Math.PI * 2;
                const dist = (Math.max(width, height) / 2) / camZoom + 100;
                
                const currentBossMilestone = Math.floor(gameTime / 300);
                const prevBossMilestone = Math.floor((gameTime - dt) / 300);
                const isBoss = (currentBossMilestone > prevBossMilestone);
                
                const randType = Math.random();
                let type = 'normal';
                let hpBase = 50, speedBase = 70, radiusBase = 14, color = '#ef4444', dmgMultiplier = 1;
                const specialChanceBonus = Math.min(0.4, wave * 0.02);

                if (isBoss || (gameTime > 300 && enemies.filter(e => e.type === 'boss').length === 0 && Math.floor(gameTime)%300 < 2)) {
                    type = 'boss'; hpBase = 12000; speedBase = 45; radiusBase = 60; color = '#a855f7'; dmgMultiplier = 2.5;
                } else if (randType < 0.15 + specialChanceBonus) {
                    type = 'sniper'; hpBase = 40; speedBase = 50; radiusBase = 13; color = '#38bdf8'; dmgMultiplier = 1.2;
                } else if (randType < 0.30 + (specialChanceBonus * 1.5)) {
                    type = 'bomber'; hpBase = 30; speedBase = 110; radiusBase = 11; color = '#f97316'; dmgMultiplier = 2.0;
                } else if (randType < 0.45 + (specialChanceBonus * 1.5)) {
                    type = 'cheetah'; hpBase = 50; speedBase = 180; radiusBase = 10; color = '#facc15'; dmgMultiplier = 1.1;
                } else if (randType < 0.55 + specialChanceBonus) {
                    type = 'elite'; hpBase = 250; speedBase = 85; radiusBase = 20; color = '#ec4899'; dmgMultiplier = 1.5;
                }

                const waveHpMultiplier = Math.pow(1.15, wave - 1) * (1 + (wave - 1) * 0.1);
                const finalHp = hpBase * waveHpMultiplier;

                enemies.push({
                    x: player.x + Math.cos(angle) * dist,
                    y: player.y + Math.sin(angle) * dist,
                    radius: radiusBase,
                    hp: finalHp, maxHp: finalHp,
                    speed: speedBase + (wave * 2),
                    type: type, color: color,
                    dmgMultiplier: dmgMultiplier,
                    hitTimer: 0,
                    shootTimer: 0,
                    patternTimer: 0,
                    isCharging: false,
                    chargeVx: 0, chargeVy: 0
                });
            }
        }

        function fireWeapon(dt, time) {
            const stats = getStatMultipliers();
            const wData = WEAPON_DATA[weaponState.id].levels[player.weaponLevel - 1];
            
            if(weaponState.isReloading) {
                weaponState.reloadTimer -= dt;
                if(weaponState.reloadTimer <= 0) {
                    weaponState.isReloading = false;
                    weaponState.mag = wData.mag;
                    document.getElementById('hud-reloading').classList.add('hidden');
                    updateHUD();
                }
                return;
            }

            const cd = wData.cd * stats.reloadCd;
            if(weaponState.mag > 0 && time - weaponState.lastFired >= cd) {
                let targets = [...enemies].sort((a, b) => Math.hypot(a.x-player.x, a.y-player.y) - Math.hypot(b.x-player.x, b.y-player.y));
                
                // 사정거리가 대폭 늘어난 권총이나 샷건도 탐지 범위(800) 내에서 적을 조준할 수 있도록 반영
                if(targets.length > 0 && Math.hypot(targets[0].x-player.x, targets[0].y-player.y) < 800 / camZoom) {
                    let fired = false;
                    const baseDmg = wData.dmg * stats.dmg;
                    const isCrit = Math.random() < stats.critChance;
                    const finalDmg = isCrit ? baseDmg * 2 : baseDmg;
                    const bulletColor = isCrit ? '#fcd34d' : '#60a5fa';

                    const bSpeed = wData.speed || 800;
                    const bLife = wData.life || 1.5;

                    if(wData.type === 'normal' || wData.type === 'dual' || wData.type === 'akimbo') {
                        let tCount = wData.targets || 1;
                        if(wData.type === 'akimbo') tCount = 3;
                        
                        for(let i=0; i<Math.min(tCount, targets.length); i++) {
                            const angle = Math.atan2(targets[i].y - player.y, targets[i].x - player.x) + (wData.type === 'akimbo' ? (Math.random()-0.5)*0.3 : 0);
                            bullets.push({
                                x: player.x, y: player.y, vx: Math.cos(angle)*bSpeed, vy: Math.sin(angle)*bSpeed,
                                dmg: finalDmg, pierce: wData.pierce, radius: 4, life: bLife, color: bulletColor, isCrit
                            });
                        }
                        fired = true;
                    } 
                    else if (wData.type === 'spread' || wData.type === 'hellfire') {
                        const targetAngle = Math.atan2(targets[0].y - player.y, targets[0].x - player.x);
                        // 레벨업에 따라 넓어지는 샷건 퍼짐각(spread) 적용
                        const spreadAngle = wData.spread;
                        for(let i=0; i<wData.pellets; i++) {
                            const angle = targetAngle - spreadAngle/2 + (spreadAngle / (wData.pellets-1)) * i;
                            bullets.push({
                                x: player.x, y: player.y, vx: Math.cos(angle)*bSpeed, vy: Math.sin(angle)*bSpeed,
                                dmg: finalDmg, pierce: wData.pierce, radius: wData.type === 'hellfire'? 6 : 3, life: bLife, color: wData.type==='hellfire'? '#f97316' : bulletColor, isCrit
                            });
                        }
                        fired = true;
                    }
                    else if (wData.type === 'pierce' || wData.type === 'railgun' || wData.type === 'pulse') {
                        const angle = Math.atan2(targets[0].y - player.y, targets[0].x - player.x);
                        bullets.push({
                            x: player.x, y: player.y, vx: Math.cos(angle)*bSpeed, vy: Math.sin(angle)*bSpeed,
                            dmg: finalDmg, pierce: wData.pierce, radius: wData.radius, life: bLife, color: wData.type==='pulse'? '#c084fc' : bulletColor, isCrit
                        });
                        fired = true;
                    }
                    else if (wData.type === 'rapid' || wData.type === 'minigun' || wData.type === 'plasma') {
                        const angle = Math.atan2(targets[0].y - player.y, targets[0].x - player.x) + (Math.random()-0.5)*0.2;
                        bullets.push({
                            x: player.x, y: player.y, vx: Math.cos(angle)*bSpeed, vy: Math.sin(angle)*bSpeed,
                            dmg: finalDmg, pierce: wData.pierce, radius: wData.type==='plasma'? 5: 3, life: bLife, color: wData.type==='plasma'? '#2dd4bf': bulletColor, isCrit
                        });
                        fired = true;
                    }

                    if(fired) {
                        weaponState.lastFired = time;
                        weaponState.mag--;
                        if(weaponState.mag <= 0) {
                            weaponState.isReloading = true;
                            weaponState.reloadTimer = wData.reload * stats.reloadCd;
                            document.getElementById('hud-reloading').classList.remove('hidden');
                        }
                        updateHUD();
                    }
                }
            }
        }

        function update(dt) {
            gameTime += dt;
            const newWave = Math.floor(gameTime / 120) + 1;
            if(newWave > wave) { 
                wave = newWave; 
                floatTexts.push({x: player.x, y: player.y - 60, text: `WAVE ${wave} REACHED! MONSTERS STRONGER!`, life: 2.0, color: '#f59e0b', size: 22});
                updateHUD(); 
            }

            const stats = getStatMultipliers();

            if(player.passives.regen > 0) {
                player.hp = Math.min(player.maxHp, player.hp + (player.maxHp * 0.015 * player.passives.regen) * dt);
            }
            if(player.passives.shockwave > 0) {
                player.shockwaveTimer -= dt;
                if(player.shockwaveTimer <= 0) {
                    player.shockwaveTimer = 3.0;
                    particles.push({x: player.x, y: player.y, r: 10, maxR: 150, life: 0.5, maxLife: 0.5, type: 'shockwave'});
                    enemies.forEach(e => {
                        const d = Math.hypot(e.x - player.x, e.y - player.y);
                        if(d < 150) {
                            const angle = Math.atan2(e.y - player.y, e.x - player.x);
                            e.x += Math.cos(angle) * (150 - d);
                            e.y += Math.sin(angle) * (150 - d);
                            e.hp -= 50 * player.passives.shockwave * stats.dmg;
                        }
                    });
                }
            }

            let vx = 0, vy = 0;
            if(keys.w) vy -= 1; if(keys.s) vy += 1;
            if(keys.a) vx -= 1; if(keys.d) vx += 1;
            if(joyActive) { vx = joyVector.x; vy = joyVector.y; }

            const len = Math.hypot(vx, vy);
            if(len > 0 && !joyActive) { vx /= len; vy /= len; }

            player.x += vx * player.speed * stats.speed * dt;
            player.y += vy * player.speed * stats.speed * dt;

            camX = player.x; camY = player.y;

            fireWeapon(dt, gameTime);
            spawnEnemy(dt);

            for(let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
                if(b.life <= 0) bullets.splice(i, 1);
            }

            for(let i = enemyBullets.length - 1; i >= 0; i--) {
                const eb = enemyBullets[i];
                eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
                if(eb.life <= 0) {
                    enemyBullets.splice(i, 1);
                    continue;
                }
                if(Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + eb.radius) {
                    player.hp -= eb.dmg * (1 + (wave - 1) * 0.08);
                    enemyBullets.splice(i, 1);
                    document.body.classList.remove('damage-flash');
                    void document.body.offsetWidth;
                    document.body.classList.add('damage-flash');
                    updateHUD();
                    if(player.hp <= 0) gameOver();
                }
            }

            const pickupRadius = 60 * stats.magnet;
            for(let i = gems.length - 1; i >= 0; i--) {
                const g = gems[i];
                const d = Math.hypot(g.x - player.x, g.y - player.y);
                if(d < pickupRadius) {
                    const angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(angle) * 400 * dt;
                    g.y += Math.sin(angle) * 400 * dt;
                }
                if(d < player.radius + 10) {
                    exp += g.val;
                    gems.splice(i, 1);
                    checkLevelUp();
                }
            }

            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].life -= dt;
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            for(let i = floatTexts.length - 1; i >= 0; i--) {
                floatTexts[i].life -= dt;
                floatTexts[i].y -= 20 * dt;
                if(floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }

            for(let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if(e.hitTimer > 0) e.hitTimer -= dt;

                if (e.type === 'boss') {
                    e.patternTimer += dt;
                    if (e.isCharging) {
                        e.x += e.chargeVx * dt;
                        e.y += e.chargeVy * dt;
                        if (e.patternTimer > 1.5) e.isCharging = false;
                    } else {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        e.x += Math.cos(angle) * e.speed * dt;
                        e.y += Math.sin(angle) * e.speed * dt;

                        if (e.patternTimer > 5.0) {
                            e.patternTimer = 0;
                            if (Math.random() < 0.5) {
                                const count = 16;
                                for (let c = 0; c < count; c++) {
                                    const a = (Math.PI * 2 / count) * c;
                                    enemyBullets.push({
                                        x: e.x, y: e.y,
                                        vx: Math.cos(a) * 280, vy: Math.sin(a) * 280,
                                        radius: 6, dmg: 20, life: 3.5
                                    });
                                }
                            } else {
                                e.isCharging = true;
                                const chargeAngle = Math.atan2(player.y - e.y, player.x - e.x);
                                e.chargeVx = Math.cos(chargeAngle) * 500;
                                e.chargeVy = Math.sin(chargeAngle) * 500;
                            }
                        }
                    }
                } else if (e.type === 'sniper') {
                    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    if (distToPlayer > 320) {
                        e.x += Math.cos(angle) * e.speed * dt;
                        e.y += Math.sin(angle) * e.speed * dt;
                    } else if (distToPlayer < 220) {
                        e.x -= Math.cos(angle) * e.speed * dt;
                        e.y -= Math.sin(angle) * e.speed * dt;
                    }
                    e.shootTimer += dt;
                    if (e.shootTimer > 2.2) {
                        e.shootTimer = 0;
                        enemyBullets.push({
                            x: e.x, y: e.y,
                            vx: Math.cos(angle) * 400, vy: Math.sin(angle) * 400,
                            radius: 4, dmg: 12, life: 3.0
                        });
                    }
                } else {
                    const angle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(angle) * e.speed * dt;
                    e.y += Math.sin(angle) * e.speed * dt;
                }

                for(let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if(Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
                        const defenseFactor = Math.max(0.4, 1 - ((wave - 1) * 0.025));
                        const actualDmg = b.dmg * defenseFactor;

                        e.hp -= actualDmg;
                        e.hitTimer = 0.1;
                        
                        particles.push({x: b.x, y: b.y, r: 2, life: 0.2, maxLife: 0.2, type: 'spark', vx: -b.vx*0.2, vy: -b.vy*0.2});
                        floatTexts.push({x: e.x + (Math.random()-0.5)*20, y: e.y - 20, text: Math.floor(actualDmg), life: 0.5, color: b.isCrit ? '#fcd34d' : 'white', size: b.isCrit? 20: 14});

                        if(b.pierce > 0) { b.pierce--; } 
                        else { bullets.splice(j, 1); }

                        if(e.hp <= 0) {
                            let gVal = (e.type === 'boss' ? 500 : (e.type === 'elite' ? 15 : 1)) * Math.min(3, 1 + (wave-1)*0.1);
                            let expVal = (e.type === 'boss' ? 300 : (e.type === 'elite' ? 20 : 1));
                            
                            goldEarned += Math.floor(gVal);
                            gems.push({x: e.x, y: e.y, val: expVal, type: e.type});
                            
                            if (e.type === 'bomber') {
                                particles.push({x: e.x, y: e.y, r: 10, maxR: 90, life: 0.4, maxLife: 0.4, type: 'shockwave'});
                                if (Math.hypot(player.x - e.x, player.y - e.y) < 90) {
                                    player.hp -= 30 * (e.dmgMultiplier || 1) * (1 + (wave-1)*0.05);
                                    updateHUD();
                                    if(player.hp <= 0) gameOver();
                                }
                            }

                            for(let k=0;k<5;k++) particles.push({x: e.x, y: e.y, r: Math.random()*4+2, life: 0.3, maxLife: 0.3, type: 'blood', vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200, color: e.color});
                            
                            enemies.splice(i, 1);
                            updateHUD();
                        }
                        break;
                    }
                }

                if(enemies[i]) {
                    if(Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                        const baseContactDmg = (e.type === 'boss' ? 50 : (e.type === 'bomber' ? 40 : (e.type === 'elite' ? 15 : 5)));
                        const dmg = baseContactDmg * (e.dmgMultiplier || 1) * (1 + (wave - 1) * 0.1) * dt;
                        player.hp -= dmg;
                        
                        document.body.classList.remove('damage-flash');
                        void document.body.offsetWidth;
                        document.body.classList.add('damage-flash');
                        updateHUD();

                        if(e.type === 'bomber') {
                            enemies.splice(i, 1);
                        }

                        if(player.hp <= 0) gameOver();
                    }
                }
            }

            if(player.hp / player.maxHp < 0.3) document.body.classList.add('low-hp-pulse');
            else document.body.classList.remove('low-hp-pulse');
        }

        function checkLevelUp() {
            if(exp >= expNeeded) {
                exp -= expNeeded;
                level++;
                expNeeded = Math.floor(expNeeded * 1.2 + 10);
                updateHUD();
                
                gameState = 'LEVELUP';
                keys.w=false; keys.a=false; keys.s=false; keys.d=false; joyActive=false;
                showLevelUpScreen();
            } else {
                updateHUD();
            }
        }

        function showLevelUpScreen() {
            const screen = document.getElementById('levelup-screen');
            const container = document.getElementById('upgrade-options');
            container.innerHTML = '';
            
            let options = [];
            
            if(player.weaponLevel < 10) {
                const nextLevelData = WEAPON_DATA[weaponState.id].levels[player.weaponLevel];
                let title = `Weapon Level Up (Lv.${player.weaponLevel + 1})`;
                if(player.weaponLevel + 1 === 5 || player.weaponLevel + 1 === 10) title = `[EVOLVE] ${nextLevelData.name}`;
                options.push({
                    title: title, desc: 'Enhance damage & capability', icon: '<span class="text-red-500 border border-red-500/50 bg-red-500/10 px-3 py-1 rounded text-xl font-black tracking-widest">[WPN]</span>',
                    action: () => { player.weaponLevel++; }
                });
            } else {
                options.push({ title: 'Repair', desc: 'Restore 50% HP', icon: '<span class="text-green-500 border border-green-500/50 bg-green-500/10 px-3 py-1 rounded text-xl font-black tracking-widest">[HP]</span>', action: () => { player.hp = Math.min(player.maxHp, player.hp + player.maxHp*0.5); } });
            }

            const pKeys = Object.keys(PASSIVES);
            for (let i = pKeys.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pKeys[i], pKeys[j]] = [pKeys[j], pKeys[i]]; }
            
            let added = 0;
            for(let k of pKeys) {
                if(added >= 2) break;
                if(player.passives[k] < PASSIVES[k].max) {
                    options.push({
                        title: `${PASSIVES[k].name} (Lv.${player.passives[k]+1})`, desc: PASSIVES[k].desc, icon: '<span class="text-blue-400 border border-blue-400/50 bg-blue-400/10 px-3 py-1 rounded text-xl font-black tracking-widest">[SYS]</span>',
                        action: () => { player.passives[k]++; }
                    });
                    added++;
                }
            }
            
            while(options.length < 3) {
                 options.push({ title: 'Gold Cache', desc: '+50 Gold', icon: '<span class="text-yellow-400 border border-yellow-400/50 bg-yellow-400/10 px-3 py-1 rounded text-xl font-black tracking-widest">[GLD]</span>', action: () => { goldEarned += 50; } });
            }

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-gray-900 border-2 border-gray-600 hover:border-blue-400 p-6 rounded-xl text-center transition-all transform hover:scale-105 flex-1 shadow-lg group';
                btn.innerHTML = `
                    <div class="mb-4 mt-2 group-hover:scale-110 transition-transform duration-200 inline-block">${opt.icon}</div>
                    <h3 class="text-xl font-bold text-white mb-2">${opt.title}</h3>
                    <p class="text-gray-400 text-sm">${opt.desc}</p>
                `;
                btn.onclick = () => {
                    opt.action();
                    screen.classList.add('hidden');
                    gameState = 'PLAYING';
                    lastTime = performance.now();
                    requestAnimationFrame(gameLoop);
                    updateHUD();
                };
                container.appendChild(btn);
            });

            screen.classList.remove('hidden');
        }

        function drawGrid(ctx, ox, oy) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            const size = 100;
            const startX = Math.floor(ox / size) * size;
            const startY = Math.floor(oy / size) * size;
            
            ctx.beginPath();
            for(let x = startX; x < ox + width/camZoom; x += size) { ctx.moveTo(x, oy); ctx.lineTo(x, oy + height/camZoom); }
            for(let y = startY; y < oy + height/camZoom; y += size) { ctx.moveTo(ox, y); ctx.lineTo(ox + width/camZoom, y); }
            ctx.stroke();
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.scale(camZoom, camZoom);
            ctx.translate(-camX, -camY);

            const vLeft = camX - (width/2)/camZoom - 50;
            const vRight = camX + (width/2)/camZoom + 50;
            const vTop = camY - (height/2)/camZoom - 50;
            const vBottom = camY + (height/2)/camZoom + 50;

            drawGrid(ctx, vLeft, vTop);

            gems.forEach(g => {
                if(g.x > vLeft && g.x < vRight && g.y > vTop && g.y < vBottom) {
                    ctx.fillStyle = g.type === 'boss' ? '#ef4444' : (g.type === 'elite' ? '#3b82f6' : '#22c55e');
                    ctx.beginPath(); ctx.arc(g.x, g.y, g.type==='boss'? 8: (g.type==='elite'?5:3), 0, Math.PI*2); ctx.fill();
                }
            });

            enemies.forEach(e => {
                if(e.x > vLeft && e.x < vRight && e.y > vTop && e.y < vBottom) {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    
                    if (e.hitTimer > 0) {
                        ctx.fillStyle = 'white';
                    } else {
                        ctx.fillStyle = e.color;
                    }

                    if (e.type === 'boss') {
                        ctx.rotate(gameTime);
                        ctx.beginPath();
                        for (let c = 0; c < 8; c++) {
                            const angle = (Math.PI * 2 / 8) * c;
                            const rx = Math.cos(angle) * e.radius;
                            const ry = Math.sin(angle) * e.radius;
                            if (c === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#f87171';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    } else if (e.type === 'sniper') {
                        ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
                        ctx.beginPath();
                        ctx.moveTo(e.radius * 1.4, 0);
                        ctx.lineTo(-e.radius, -e.radius * 0.8);
                        ctx.lineTo(-e.radius * 0.5, 0);
                        ctx.lineTo(-e.radius, e.radius * 0.8);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#bae6fd';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    } else if (e.type === 'bomber') {
                        const pulse = Math.sin(gameTime * 15) * 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, e.radius + pulse, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#fef08a';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    } else if (e.type === 'cheetah') {
                        ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
                        ctx.beginPath();
                        ctx.moveTo(e.radius * 1.5, 0);
                        ctx.lineTo(-e.radius, -e.radius);
                        ctx.lineTo(-e.radius * 0.5, 0);
                        ctx.lineTo(-e.radius, e.radius);
                        ctx.closePath();
                        ctx.fill();
                    } else if (e.type === 'elite') {
                        ctx.fillRect(-e.radius, -e.radius*0.5, e.radius*2, e.radius);
                        ctx.fillRect(-e.radius*0.5, -e.radius, e.radius, e.radius*2);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-e.radius, -e.radius*0.5, e.radius*2, e.radius);
                    } else {
                        ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI*2); ctx.fill();
                    }
                    
                    ctx.restore();

                    if(e.hp < e.maxHp) {
                        ctx.fillStyle = 'black'; ctx.fillRect(e.x - e.radius, e.y - e.radius - 12, e.radius*2, 4);
                        ctx.fillStyle = e.type === 'boss' ? '#c084fc' : 'red'; 
                        ctx.fillRect(e.x - e.radius, e.y - e.radius - 12, (e.radius*2)*(Math.max(0,e.hp)/e.maxHp), 4);
                    }
                }
            });

            ctx.fillStyle = '#10b981';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();

            bullets.forEach(b => {
                if(b.x > vLeft && b.x < vRight && b.y > vTop && b.y < vBottom) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
                }
            });

            enemyBullets.forEach(eb => {
                if(eb.x > vLeft && eb.x < vRight && eb.y > vTop && eb.y < vBottom) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI*2); ctx.fill();
                }
            });

            particles.forEach(p => {
                if(p.type === 'shockwave') {
                    ctx.strokeStyle = `rgba(59, 130, 246, ${p.life/p.maxLife})`;
                    ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + (p.maxR - p.r) * (1 - p.life/p.maxLife), 0, Math.PI*2); ctx.stroke();
                } else {
                    ctx.fillStyle = p.color || (p.type === 'spark' ? 'yellow' : 'white');
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                    if(p.vx) p.x += p.vx * 0.016; if(p.vy) p.y += p.vy * 0.016;
                }
            });

            ctx.font = 'bold 16px Orbitron';
            ctx.textAlign = 'center';
            floatTexts.forEach(t => {
                ctx.fillStyle = t.color;
                ctx.globalAlpha = Math.max(0, t.life / 0.5);
                ctx.font = `bold ${t.size}px sans-serif`;
                ctx.fillText(t.text, t.x, t.y);
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;

            update(dt);
            draw();

            if (gameState === 'PLAYING') requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('hud-wave').innerText = `WAVE: ${wave}`;
            document.getElementById('hud-time').innerText = `${Math.floor(gameTime/60).toString().padStart(2,'0')}:${Math.floor(gameTime%60).toString().padStart(2,'0')}`;
            document.getElementById('gold-val').innerText = goldEarned;
            
            const wData = WEAPON_DATA[weaponState.id].levels[player.weaponLevel - 1];
            let wName = WEAPON_DATA[weaponState.id].name;
            if(wData.name) wName = wData.name;
            document.getElementById('hud-weapon').innerText = `${wName} (Lv.${player.weaponLevel})`;
            
            document.getElementById('hud-ammo-current').innerText = weaponState.mag;
            document.getElementById('hud-ammo-max').innerText = wData.mag;

            document.getElementById('hud-level').innerText = level;
            document.getElementById('hud-exp-text').innerText = `${exp} / ${expNeeded}`;
            document.getElementById('hud-exp-bar').style.width = `${(exp/expNeeded)*100}%`;

            const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            document.getElementById('hud-hp-bar').style.width = `${hpPercent}%`;
            document.getElementById('hud-hp-text').innerText = `${Math.floor(Math.max(0, player.hp))} / ${player.maxHp}`;
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            saveData.gold += goldEarned;
            saveGame();
            
            document.getElementById('go-wave').innerText = wave;
            document.getElementById('go-gold').innerText = goldEarned;
            document.getElementById('gameover-screen').classList.remove('hidden');
            document.body.classList.remove('low-hp-pulse', 'damage-flash');
        }

        function returnToMenu() {
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            initMenu();
        }

        function initMenu() {
            document.getElementById('menu-gold').innerText = saveData.gold;
            
            ['attack', 'maxHp', 'moveSpeed'].forEach(stat => {
                document.getElementById(`upg-${stat}-lv`).innerText = saveData.upgrades[stat];
                document.getElementById(`upg-${stat}-cost`).innerText = `${(saveData.upgrades[stat] + 1) * 100}G`;
            });

            const wList = document.getElementById('weapon-list');
            wList.innerHTML = '';
            Object.keys(WEAPON_DATA).forEach(key => {
                const w = WEAPON_DATA[key];
                const isUnlocked = saveData.weapons[key];
                const isEquipped = saveData.equipped === key;
                
                const div = document.createElement('div');
                div.className = `p-3 rounded border flex justify-between items-center transition-colors ${isUnlocked ? (isEquipped ? 'bg-blue-900 border-blue-400' : 'bg-gray-800 border-gray-600 hover:bg-gray-700 cursor-pointer') : 'bg-gray-900 border-red-900 opacity-80'}`;
                
                if(isUnlocked && !isEquipped) div.onclick = () => { saveData.equipped = key; saveGame(); initMenu(); };
                
                let btnHTML = '';
                if(isEquipped) btnHTML = `<span class="text-blue-300 font-bold text-sm">EQUIPPED</span>`;
                else if(isUnlocked) btnHTML = `<span class="text-gray-400 text-sm">EQUIP</span>`;
                else btnHTML = `<button onclick="unlockWeapon('${key}')" class="bg-red-900 hover:bg-red-800 text-xs px-2 py-1 rounded text-white shadow">UNLOCK (${w.cost}G)</button>`;

                div.innerHTML = `
                    <div>
                        <p class="font-bold text-white">${w.name}</p>
                        ${!isUnlocked ? `<p class="text-xs text-red-400">Locked</p>` : ''}
                    </div>
                    ${btnHTML}
                `;
                wList.appendChild(div);
            });
        }

        function buyUpgrade(stat) {
            const cost = (saveData.upgrades[stat] + 1) * 100;
            if(saveData.gold >= cost && saveData.upgrades[stat] < 10) {
                saveData.gold -= cost;
                saveData.upgrades[stat]++;
                saveGame();
                initMenu();
            }
        }

        function unlockWeapon(key) {
            const cost = WEAPON_DATA[key].cost;
            if(saveData.gold >= cost && !saveData.weapons[key]) {
                saveData.gold -= cost;
                saveData.weapons[key] = true;
                saveGame();
                initMenu();
            }
        }

        function startGame() { initMenu(); initGame(); }

        initMenu();
    </script>
</body>
</html>
